# Saltbox compose — join the saltbox network only.
# Traefik routing is the file provider: run scripts/saltbox-publish.sh
# which writes /opt/traefik/wud.yml. Docker labels are not used.
#
# Watchers: https://getwud.app/docs/configuration/watchers/
# Updates: WUD command trigger runs host `sb install <container>` between 01:00–03:00.

services:
  wud:
    build: .
    image: wud-saltbox:local
    restart: unless-stopped
    container_name: wud
    hostname: wud
    # Host PID + privileged so nsenter can run /usr/local/bin/sb on the host.
    pid: host
    privileged: true
    env_file:
      - path: .env
        required: true
    environment:
      TZ: "${TZ:-Europe/Isle_of_Man}"
      WUD_LOG_LEVEL: "${WUD_LOG_LEVEL:-info}"
      WUD_SERVER_PORT: "3000"
      WUD_WATCHER_LOCAL_SOCKET: /var/run/docker.sock
      WUD_WATCHER_LOCAL_CRON: "${WUD_WATCHER_LOCAL_CRON:-0 1 * * *}"
      WUD_WATCHER_LOCAL_JITTER: "${WUD_WATCHER_LOCAL_JITTER:-60000}"
      WUD_WATCHER_LOCAL_WATCHBYDEFAULT: "${WUD_WATCHER_LOCAL_WATCHBYDEFAULT:-true}"
      WUD_WATCHER_LOCAL_WATCHALL: "${WUD_WATCHER_LOCAL_WATCHALL:-false}"
      WUD_WATCHER_LOCAL_WATCHATSTART: "${WUD_WATCHER_LOCAL_WATCHATSTART:-true}"
      WUD_WATCHER_LOCAL_WATCHEVENTS: "${WUD_WATCHER_LOCAL_WATCHEVENTS:-true}"
      SB_INSTALL_ENABLED: "${SB_INSTALL_ENABLED:-true}"
      SB_INSTALL_HOUR_START: "${SB_INSTALL_HOUR_START:-1}"
      SB_INSTALL_HOUR_END: "${SB_INSTALL_HOUR_END:-3}"
      SB_INSTALL_SKIP: "${SB_INSTALL_SKIP:-wud,arbor,arbor-vnc,arbour-fetcher,arbor-fetcher}"
      WUD_TRIGGER_COMMAND_SALTBOX_CMD: /scripts/sb-install.sh
      WUD_TRIGGER_COMMAND_SALTBOX_SHELL: /bin/sh
      WUD_TRIGGER_COMMAND_SALTBOX_TIMEOUT: "0"
      WUD_TRIGGER_COMMAND_SALTBOX_AUTO: "true"
      WUD_TRIGGER_COMMAND_SALTBOX_ONCE: "false"
      WUD_TRIGGER_COMMAND_SALTBOX_MODE: simple
      WUD_TRIGGER_COMMAND_SALTBOX_THRESHOLD: all
    volumes:
      - ./data/store:/store
      - ./scripts/sb-install.sh:/scripts/sb-install.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - saltbox
    labels:
      com.github.saltbox.saltbox_managed: "true"
      diun.enable: "true"
      wud.tag.include: "^latest$$"
      wud.watch.digest: "true"
      wud.watch: "false"
      wud.link.template: "https://github.com/getwud/wud/releases"

networks:
  saltbox:
    external: true
