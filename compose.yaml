# Saltbox compose — join the saltbox network only.
# Traefik routing is the file provider: run scripts/saltbox-publish.sh
# which writes /opt/traefik/wud.yml. Docker labels are not used.
#
# Watchers: https://getwud.app/docs/configuration/watchers/
# Default watcher "local" monitors the host Docker socket.

services:
  wud:
    image: getwud/wud
    restart: unless-stopped
    container_name: wud
    hostname: wud
    env_file:
      - path: .env
        required: true
    environment:
      TZ: "${TZ:-Europe/Isle_of_Man}"
      WUD_LOG_LEVEL: "${WUD_LOG_LEVEL:-info}"
      WUD_SERVER_PORT: "3000"
      WUD_WATCHER_LOCAL_SOCKET: /var/run/docker.sock
      WUD_WATCHER_LOCAL_CRON: "${WUD_WATCHER_LOCAL_CRON:-0 1 * * *}"
      WUD_WATCHER_LOCAL_JITTER: "${WUD_WATCHER_LOCAL_JITTER:-60000}"
      WUD_WATCHER_LOCAL_WATCHBYDEFAULT: "${WUD_WATCHER_LOCAL_WATCHBYDEFAULT:-true}"
      WUD_WATCHER_LOCAL_WATCHALL: "${WUD_WATCHER_LOCAL_WATCHALL:-false}"
      WUD_WATCHER_LOCAL_WATCHATSTART: "${WUD_WATCHER_LOCAL_WATCHATSTART:-true}"
      WUD_WATCHER_LOCAL_WATCHEVENTS: "${WUD_WATCHER_LOCAL_WATCHEVENTS:-true}"
      WUD_WATCHER_LOCAL_WATCHDIGESTDEFAULT: "${WUD_WATCHER_LOCAL_WATCHDIGESTDEFAULT:-true}"
    volumes:
      - ./data/store:/store
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - saltbox
    labels:
      com.github.saltbox.saltbox_managed: "true"
      diun.enable: "true"
      wud.tag.include: "^latest$$"
      wud.watch.digest: "true"
      wud.link.template: "https://github.com/getwud/wud/releases"

networks:
  saltbox:
    external: true
